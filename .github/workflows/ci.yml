name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24: node:sqlite is stable there (22 needs --experimental-sqlite).
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The Electron binary is not needed for type-checking or tests
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: The package manifest is valid UTF-8
        # A BOM or a stray byte makes node fail with ERR_INVALID_PACKAGE_CONFIG,
        # and it takes the whole container down. It is invisible in a diff.
        run: |
          node -e "const b=require('fs').readFileSync('package.json'); JSON.parse(b.toString('utf8')); if(b[0]===0xef) { console.error('BOM'); process.exit(1) }"

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Check assets
        # Every sprite and room the code can ask for exists in public/, and
        # public/ stays under its size budget (scripts/check-assets.mjs)
        run: npm run check-assets

      - name: The image builds and the server answers
        # The image is what runs in production: a broken build step or a
        # missing file only shows up here.
        run: |
          docker build -t virtual-agent-office:ci .
          docker run -d --name office-ci -p 3399:3334 \
            -e AGENT_OFFICE_API_TOKEN=ci-token \
            virtual-agent-office:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3399/health > /dev/null; then
              echo "the office answers /health"
              docker rm -f office-ci
              exit 0
            fi
            sleep 1
          done
          echo "the office never came up:"
          docker logs office-ci
          docker rm -f office-ci
          exit 1
